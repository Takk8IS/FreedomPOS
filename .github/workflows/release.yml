name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    release:
        permissions: write-all
        strategy:
            fail-fast: false
            matrix:
                platform: [macos-latest, ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 20.11.1
                  cache: npm

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt
                  targets: |
                      aarch64-apple-darwin
                      x86_64-apple-darwin
                      x86_64-unknown-linux-gnu
                      x86_64-pc-windows-msvc

            - name: Cache node_modules
              uses: actions/cache@v4
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Get Version
              id: version
              uses: notiz-dev/github-action-json-property@release
              with:
                  path: package.json
                  prop_path: version

            - name: Rust Cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: ./src-tauri -> target

            - name: Install dependencies (ubuntu only)
              if: matrix.platform == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev webkit2gtk-4.0 libappindicator3-dev librsvg2-dev patchelf

            - name: Install dependencies
              run: npm ci

            - name: Next.js Build
              env:
                  NEXT_TELEMETRY_DISABLED: 1
                  CI: true
                  NODE_ENV: production
              run: npm run build

            - name: Package web build
              if: matrix.platform == 'ubuntu-latest'
              run: |
                # Create a clean artifact with proper structure
                mkdir -p web-build
                cp -r out/* web-build/
                # Create a tarball for the web version
                tar -czf freedom-pos-web-v${{ steps.version.outputs.version }}.tar.gz web-build
                # Also create a zip file which might be more accessible for some users
                zip -r freedom-pos-web-v${{ steps.version.outputs.version }}.zip web-build

            - name: Upload web build to release
              if: matrix.platform == 'ubuntu-latest'
              uses: softprops/action-gh-release@v1
              with:
                files: |
                  freedom-pos-web-v${{ steps.version.outputs.version }}.tar.gz
                  freedom-pos-web-v${{ steps.version.outputs.version }}.zip
                tag_name: v${{ steps.version.outputs.version }}

            - name: Set Tauri args
              id: tauri_args
              shell: bash
              run: |
                if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
                  echo "args=--target universal-apple-darwin" >> $GITHUB_OUTPUT
                else
                  echo "args=" >> $GITHUB_OUTPUT
                fi

            - name: Build Tauri
              uses: tauri-apps/tauri-action@v0.5.20
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tauriScript: npm run tauri
                  args: ${{ steps.tauri_args.outputs.args }}
                  tagName: v${{ steps.version.outputs.version }}
                  releaseName: "Freedom POS v${{ steps.version.outputs.version }}"
                  releaseBody: |
                      ## Freedom POS v${{ steps.version.outputs.version }}

                      ### Downloads
                      - Web: `.zip` and `.tar.gz` archives for web deployment
                      - Windows: `.msi` installer
                      - macOS: `.dmg` installer and `.app` bundle (Universal Binary - Intel/Apple Silicon)
                      - Linux: `.deb` package and `.AppImage` portable executable

                      ### Notes
                      - This is an automated release build
                      - Assets will be attached automatically after all builds complete
                  releaseDraft: true
                  prerelease: false
                  includeUpdaterJson: false
                  includeRelease: true
